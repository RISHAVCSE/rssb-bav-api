name: Build and Deploy Spring Boot

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Spring Boot application
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: rishavcse1/rssb-springboot:${{ github.sha }}

      - name: Deploy Spring Boot to Kubernetes
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 161.118.167.160
          username: ubuntu
          key: ${{ secrets.KUBE_SSH_KEY }}
          script: |
            kubectl set image deployment/springboot \
              springboot=rishavcse1/rssb-springboot:${{ github.sha }}

            kubectl rollout status deployment/springboot --timeout=180s

            kubectl get deployment springboot
            kubectl get pods -l app=springboot